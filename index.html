<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 Estufa Automatizada - Dashboard</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --primary: #4CAF50;
            --secondary: #2196F3;
            --background: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header div {
            text-align: left;
        }

        #logout-btn {
            background-color: #f44336;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            display: none;
            margin-left: 20px;
        }

        main {
            padding: 20px;
            flex-grow: 1;
        }

        #auth-container, #reset-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: var(--card-bg);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        input[type="email"],
        input[type="password"] {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #login-btn, #cadastro-btn, #reset-btn {
            background-color: var(--primary);
            color: white;
        }

        .toggle-form {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .toggle-form a {
            color: var(--primary);
            cursor: pointer;
            text-decoration: none;
        }

        #dashboard {
            display: none;
            max-width: 1000px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .data-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .data-card h3 {
            margin-top: 0;
            color: var(--primary);
        }

        .value {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--text-color);
        }

        #google-login {
            margin-top: 10px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>🌱 Estufa Automatizada</h1>
            <p id="user-status">Faça Login.</p>
        </div>
        <button id="logout-btn">Sair</button>
    </header>

    <main>
        <!-- LOGIN / CADASTRO -->
        <div id="auth-container">
            <h2 id="form-title">Login</h2>
            <form id="auth-form">
                <input type="email" id="email" placeholder="E-mail" required>
                <input type="password" id="senha" placeholder="Senha" required>
                <button type="submit" id="login-btn">Entrar</button>
            </form>

            <p style="text-align:center; margin-top:10px;">
                <a id="forgot-password-link" style="color:#2196F3; cursor:pointer;">Esqueceu sua senha?</a>
            </p>

            <div id="google-login"></div>

            <div class="toggle-form">
                <p>Não tem conta? <a id="toggle-to-cadastro">Cadastre-se</a></p>
            </div>
            <div id="message" style="margin-top: 10px; color: red; text-align: center;"></div>
        </div>

        <!-- REDEFINIR SENHA -->
        <div id="reset-container" style="display:none;">
            <h2>Redefinir Senha</h2>
            <input type="password" id="nova-senha" placeholder="Nova senha" required>
            <input type="password" id="confirma-senha" placeholder="Confirmar senha" required>
            <button id="reset-btn">Redefinir Senha</button>
            <p style="text-align:center; margin-top:15px;">
                <a id="voltar-login" style="color:#2196F3; cursor:pointer;">Voltar ao login</a>
            </p>
            <div id="reset-message" style="margin-top:10px; text-align:center;"></div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard">
            <div class="data-card">
                <h3>Temperatura</h3>
                <p class="value" id="temp-value">--</p>
                <small id="temp-time">Última leitura: --</small>
            </div>
            <div class="data-card">
                <h3>Umidade</h3>
                <p class="value" id="umi-value">--</p>
                <small id="umi-time">Última leitura: --</small>
            </div>
            <div class="data-card">
                <h3>Luminosidade</h3>
                <p class="value" id="lumi-value">--</p>
                <small id="lumi-time">Última leitura: --</small>
            </div>
            <div class="data-card">
                <h3>Altura da Planta</h3>
                <p class="value" id="alt-value">--</p>
                <small id="alt-time">Última leitura: --</small>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:3000';
        const GOOGLE_CLIENT_ID = '679918782521-189tv6r6flciju3ndc4426fib4pnelai.apps.googleusercontent.com';

        const authContainer = document.getElementById('auth-container');
        const dashboard = document.getElementById('dashboard');
        const authForm = document.getElementById('auth-form');
        const formTitle = document.getElementById('form-title');
        const messageDiv = document.getElementById('message');
        const toggleCadastro = document.getElementById('toggle-to-cadastro');
        const logoutBtn = document.getElementById('logout-btn');
        const forgotLink = document.getElementById('forgot-password-link');
        const resetContainer = document.getElementById('reset-container');
        const resetBtn = document.getElementById('reset-btn');
        const resetMessage = document.getElementById('reset-message');
        const voltarLogin = document.getElementById('voltar-login');
        let loginBtn = document.getElementById('login-btn');
        let isLogin = true;

        function showMessage(msg, isError = true) {
            messageDiv.textContent = msg;
            messageDiv.style.color = isError ? 'red' : 'green';
        }

        function setLoggedOut() {
            localStorage.removeItem('jwtToken');
            authContainer.style.display = 'block';
            dashboard.style.display = 'none';
            logoutBtn.style.display = 'none';
            document.getElementById('user-status').textContent = 'Faça Login.';
            if (typeof google !== 'undefined' && google.accounts.id) {
                google.accounts.id.disableAutoSelect();
            }
        }

        function setLoggedIn(token) {
            localStorage.setItem('jwtToken', token);
            authContainer.style.display = 'none';
            dashboard.style.display = 'grid';
            logoutBtn.style.display = 'block';
            document.getElementById('user-status').textContent = 'Bem-vindo(a)!';
            fetchEstufaData();
        }

        logoutBtn.addEventListener('click', setLoggedOut);

        function toggleForm() {
            isLogin = !isLogin;
            formTitle.textContent = isLogin ? 'Login' : 'Cadastro';
            loginBtn.textContent = isLogin ? 'Entrar' : 'Cadastrar';
            toggleCadastro.textContent = isLogin ? 'Cadastre-se' : 'Fazer Login';
            messageDiv.textContent = '';
        }

        toggleCadastro.addEventListener('click', toggleForm);

        async function handleGoogleCredentialResponse(response) {
            if (!response.credential) return showMessage('Falha ao obter credencial do Google.');
            showMessage('Autenticando com o Google...', false);
            try {
                const apiResponse = await fetch(`${API_URL}/login-google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });
                const data = await apiResponse.json();
                if (apiResponse.ok) setLoggedIn(data.token);
                else showMessage(data.erro || 'Erro ao processar login Google.');
            } catch {
                showMessage('Erro de conexão com a API.');
            }
        }

        // Login/Cadastro padrão
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const endpoint = isLogin ? '/login' : '/cadastro';

            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await response.json();
                if (response.ok) {
                    if (isLogin) setLoggedIn(data.token);
                    else {
                        showMessage(data.mensagem + '. Faça login agora.', false);
                        toggleForm();
                    }
                } else showMessage(data.erro || 'Erro na requisição.');
            } catch {
                showMessage('Erro de conexão com a API.');
            }
        });

        // Esqueci minha senha
        forgotLink.addEventListener('click', async () => {
            const email = prompt('Digite seu e-mail cadastrado:');
            if (!email) return;
            try {
                const response = await fetch(`${API_URL}/esqueci-senha`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                if (response.ok) alert('Um e-mail com o link de redefinição foi enviado.');
                else alert(data.erro || 'Erro ao enviar e-mail.');
            } catch {
                alert('Erro de conexão com o servidor.');
            }
        });

        // Página de redefinição
        if (window.location.pathname.includes('redefinir-senha')) {
            authContainer.style.display = 'none';
            resetContainer.style.display = 'block';
            const token = window.location.search.split('token=')[1];

            resetBtn.addEventListener('click', async () => {
                const nova = document.getElementById('nova-senha').value;
                const confirma = document.getElementById('confirma-senha').value;
                if (nova !== confirma) {
                    resetMessage.textContent = 'As senhas não coincidem.';
                    resetMessage.style.color = 'red';
                    return;
                }
                try {
                    const response = await fetch(`${API_URL}/redefinir-senha`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, senha: nova })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        resetMessage.textContent = data.mensagem || 'Senha redefinida!';
                        resetMessage.style.color = 'green';
                        setTimeout(() => window.location.href = '/', 3000);
                    } else {
                        resetMessage.textContent = data.erro || 'Erro ao redefinir senha.';
                        resetMessage.style.color = 'red';
                    }
                } catch {
                    resetMessage.textContent = 'Erro de conexão com o servidor.';
                    resetMessage.style.color = 'red';
                }
            });
        }

        voltarLogin.addEventListener('click', () => {
            resetContainer.style.display = 'none';
            authContainer.style.display = 'block';
        });

        // Atualização de sensores
        async function fetchSensor(endpoint, valueId, timeId, unit = '') {
            const token = localStorage.getItem('jwtToken');
            if (!token) return;

            try {
                const response = await fetch(`${API_URL}/estufa${endpoint}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.length > 0) {
                        const leitura = data[0];
                        const valor = leitura.temperatura || leitura.umidade || leitura.lux || leitura.altura;
                        document.getElementById(valueId).textContent = (valor !== undefined ? valor : 'N/A') + unit;
                        document.getElementById(timeId).textContent = `Última leitura: ${new Date(leitura.data_hora).toLocaleString('pt-BR')}`;
                    }
                } else if ([401, 403].includes(response.status)) {
                    showMessage('Sessão expirada. Faça login novamente.');
                    setLoggedOut();
                }
            } catch (error) {
                console.error('Erro ao buscar sensor:', error);
            }
        }

        async function fetchEstufaData() {
            if (localStorage.getItem('jwtToken')) {
                await fetchSensor('/temperatura', 'temp-value', 'temp-time', '°C');
                await fetchSensor('/umidade', 'umi-value', 'umi-time', '%');
                await fetchSensor('/luminosidade', 'lumi-value', 'lumi-time', ' lux');
                await fetchSensor('/altura', 'alt-value', 'alt-time', ' cm');
                setTimeout(fetchEstufaData, 60000);
            }
        }

        // Inicializa após tudo carregado
        window.addEventListener('load', () => {
            const token = localStorage.getItem('jwtToken');
            if (token) setLoggedIn(token);
            else setLoggedOut();

            // Inicializa botão do Google
            if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById('google-login'),
                    { theme: 'outline', size: 'large', text: 'signin_with' }
                );
            } else {
                console.error("Google API não carregada. Verifique a conexão e o client_id.");
            }
        });
    </script>
</body>
</html>
