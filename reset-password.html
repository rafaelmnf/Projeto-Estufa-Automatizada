<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir Senha</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d2d0d, #118f2b);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #reset-box {
      width: 420px;
      max-width: 90%;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    h2 {
      color: white;
      margin-bottom: 25px;
      font-size: 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: #1e1e1e;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #2ecc71;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #28b864;
    }
  </style>
</head>

<body>

  <div id="reset-box">
    <h2>Redefinir Senha</h2>

    <form id="resetForm">
      <input type="password" id="novaSenha" placeholder="Nova senha" required />
      <input type="password" id="confirmarSenha" placeholder="Confirmar senha" required />
      <button type="submit">Salvar nova senha</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('resetForm');
    const token = new URLSearchParams(window.location.search).get('token');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const novaSenha = document.getElementById('novaSenha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;

      if (novaSenha !== confirmarSenha) {
        alert('As senhas não coincidem!');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/redefinir-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, novaSenha })
        });

        const data = await response.json();
        alert(data.message || 'Senha redefinida com sucesso!');
        if (response.ok) {
          window.location.href = '/index.html';
        }
      } catch (error) {
        console.error(error);
        alert('Erro ao redefinir senha.');
      }
    });
  </script>

</body>
</html>
