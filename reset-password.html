<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir Senha</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f4f4f4;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
      display: flex;
      flex-direction: column;
    }
    input {
      margin-bottom: 10px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <h2>Redefinir Senha</h2>
  <form id="resetForm">
    <input type="password" id="novaSenha" placeholder="Nova senha" required />
    <input type="password" id="confirmarSenha" placeholder="Confirmar senha" required />
    <button type="submit">Salvar nova senha</button>
  </form>

  <script>
    const form = document.getElementById('resetForm');
    const token = new URLSearchParams(window.location.search).get('token');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const novaSenha = document.getElementById('novaSenha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;

      if (novaSenha !== confirmarSenha) {
        alert('As senhas não coincidem!');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/redefinir-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, novaSenha })
        });

        const data = await response.json();
        alert(data.message || 'Senha redefinida com sucesso!');
        if (response.ok) {
          window.location.href = '/index.html';
        }
      } catch (error) {
        console.error(error);
        alert('Erro ao redefinir senha.');
      }
    });
  </script>
</body>
</html>
